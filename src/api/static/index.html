<!DOCTYPE html>
<html lang="en">
<head
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructor Model Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    input {
      background: #334155;
      color: white;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .result {
      margin-top: 1.5rem;
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .loading {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Run Instructor Model</h1>

    <input id="subject" type="text" placeholder="Enter subject (e.g. Linear Algebra)" />

    <input id="file" type="file" />

    <button id="submitBtn">Run Model</button>

    <div class="loading" id="loading" style="display:none;">
      Processing...
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const API_URL = https://qlassifier-app-233789415416.asia-southeast1.run.app

    const submitBtn = document.getElementById("submitBtn");
    const resultDiv = document.getElementById("result");
    const loadingDiv = document.getElementById("loading");

    submitBtn.addEventListener("click", async () => {
      const subject = document.getElementById("subject").value;
      const fileInput = document.getElementById("file");
      const file = fileInput.files[0];

      if (!subject || !file) {
        alert("Please enter subject and select a file.");
        return;
      }

      submitBtn.disabled = true;
      loadingDiv.style.display = "block";
      resultDiv.textContent = "";

      const formData = new FormData();
      formData.append("subject", subject);
      formData.append("file", file);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data = await response.json();
        resultDiv.textContent = JSON.stringify(data, null, 2);

      } catch (err) {
        resultDiv.textContent = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        loadingDiv.style.display = "none";
      }
    });
  </script>

</body>
</html>
