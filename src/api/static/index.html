<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructor Model Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin-bottom: 2rem;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    select, input[type=file], button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    select {
      background: #334155;
      color: white;
    }

    input[type=file] {
      background: #334155;
      color: white;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .loading {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .result-card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .answer {
      padding-left: 1rem;
      margin-bottom: 0.25rem;
    }

    .score {
      color: #3b82f6;
      font-weight: bold;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Run Instructor Model</h1>
    <p style="color:#94a3b8; font-size:0.95rem; margin-top:0.5rem;">
    Upload a VCE exam and choose the relevant subject to run the model.
    </p>
    <select id="subject">
      <option value="">Loading subjects...</option>
    </select>

    <input id="file" type="file" />

    <button id="submitBtn">Run Model</button>

    <div class="loading" id="loading" style="display:none;">
      Processing...
    </div>

    <div id="result"></div>
  </div>

  <script>
    const API_URL = "/run_instructor";
    const SUBJECTS_URL = "/subjects";  // New endpoint to fetch subjects

    const submitBtn = document.getElementById("submitBtn");
    const resultDiv = document.getElementById("result");
    const loadingDiv = document.getElementById("loading");
    const subjectSelect = document.getElementById("subject");

    // Load subjects dynamically
    async function loadSubjects() {
      try {
        const res = await fetch(SUBJECTS_URL);
        const data = await res.json();
        subjectSelect.innerHTML = "";
        data.forEach(subject => {
          const opt = document.createElement("option");
          opt.value = subject;
          opt.textContent = subject;
          subjectSelect.appendChild(opt);
        });
      } catch (err) {
        subjectSelect.innerHTML = `<option value="">Error loading subjects</option>`;
      }
    }

    loadSubjects();

    submitBtn.addEventListener("click", async () => {
      const subject = subjectSelect.value;
      const fileInput = document.getElementById("file");
      const file = fileInput.files[0];

      if (!subject || !file) {
        alert("Please select a subject and a file.");
        return;
      }

      submitBtn.disabled = true;
      loadingDiv.style.display = "block";
      resultDiv.innerHTML = "";

      const formData = new FormData();
      formData.append("subject", subject);
      formData.append("file", file);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`Server error: ${response.status}\n${text}`);
        }

        const data = await response.json();

        // Pretty render
        for (const [question, answers] of Object.entries(data)) {
          const qCard = document.createElement("div");
          qCard.className = "result-card";

          const qTitle = document.createElement("div");
          qTitle.className = "question-title";
          qTitle.textContent = question;
          qCard.appendChild(qTitle);

          answers.forEach(([answerText, score]) => {
            const aDiv = document.createElement("div");
            aDiv.className = "answer";
            aDiv.textContent = answerText;
            const sSpan = document.createElement("span");
            sSpan.className = "score";
            sSpan.textContent = score.toFixed(3);
            aDiv.appendChild(sSpan);
            qCard.appendChild(aDiv);
          });

          resultDiv.appendChild(qCard);
        }

      } catch (err) {
        resultDiv.textContent = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        loadingDiv.style.display = "none";
      }
    });
  </script>

</body>
</html>
